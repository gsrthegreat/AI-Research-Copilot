[project]
name = "ai-research-copilot-backend"
version = "0.1.0"
description = "Backend API for AI Research Copilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "supabase",
    "psycopg2-binary",
    "chromadb",
    "sentence-transformers",
    "anthropic",
    "python-multipart",
    "aiofiles",
    "python-dotenv",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
